name: PodPassportScanner
options:
  bundleIdPrefix: org.jeswr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  NFCPassportReader:
    url: https://github.com/AndyQ/NFCPassportReader
    exactVersion: 2.3.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  PodPassportScanner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: NFCPassportReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.jeswr.PodPassportScanner
        CODE_SIGN_STYLE: Automatic
        # Apple Developer team (Jesse Wright, individual). Simulator builds work
        # without a team; device + TestFlight builds use this.
        DEVELOPMENT_TEAM: "7J8623FGRC"
        TARGETED_DEVICE_FAMILY: "1"
        VERSIONING_SYSTEM: "apple-generic"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Pod Passport
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NFCReaderUsageDescription: >-
          Pod Passport Scanner reads the NFC chip inside your passport so a
          verifiable credential can be issued into your Solid pod. Chip data is
          sent only to the issuer endpoint you scanned.
        NSCameraUsageDescription: >-
          The camera is used to scan the issuer QR code and the machine-readable
          zone (MRZ) printed in your passport. No images leave your device.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - A0000002471001
    entitlements:
      path: Sources/PodPassportScanner.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG

  PodPassportScannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PodPassportScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

  PodPassportScannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PodPassportScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  PodPassportScanner:
    build:
      targets:
        PodPassportScanner: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PodPassportScannerTests
        - PodPassportScannerUITests
